name: Build and deploy demo to Github Pages

on:
  release:
    types: [published]

jobs:
  build:
    environment: CI
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
      - run: echo "PUBLIC_BASE_PATH=/${{ github.event.repository.name }}/" > .env
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/client/'

  deploy-demo:
    if: startsWith(github.ref, 'refs/tags/releases/')
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
